# AK Cafe - Docker Compose
# Modern kafe web sitesi için container orchestration

version: '3.8'

services:
  ak-cafe:
    build: .
    container_name: ak-cafe-website
    ports:
      - "8080:80"
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ak-cafe-network

  # Opsiyonel: Nginx reverse proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: ak-cafe-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ak-cafe
    restart: unless-stopped
    networks:
      - ak-cafe-network
    profiles:
      - production

networks:
  ak-cafe-network:
    driver: bridge

volumes:
  ak-cafe-data:
    driver: local 